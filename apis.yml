  name: AirDNA Market Search
  tags:
  - Market Search
  - Markets
  - Submarkets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.airdna.co/
  baseURL: https://api.airdna.co/api/enterprise/v2
