aid: airdna
url: https://raw.githubusercontent.com/api-evangelist/airdna/refs/heads/main/apis.yml
name: AirDNA
kind: company
description: AirDNA provides short-term rental market data and analytics for Airbnb
  and Vrbo, tracking over 10 million listings across 120,000+ markets. The AirDNA
  Enterprise API exposes market metrics, STR listing data, comparable property sets,
  Rentalizer revenue estimates, and Smart Rates pricing through a Bearer-authenticated
  REST interface.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Short-Term Rental
- Vacation Rental
- Market Data
- Real Estate
- Analytics
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
