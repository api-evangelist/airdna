    type: Documentation
  - url: https://airdna.redoc.ly/
    type: APIReference
  - url: openapi/airdna-openapi.yml
    type: OpenAPI
  description: Search for markets and submarkets by search term or coordinates, explore
    markets within a country, and resolve whether AirDNA has a location mapped and
    under what market type.
- aid: airdna:market-stats
  name: AirDNA Market Stats
  tags:
  - Market Metrics
  - Occupancy
  - Revenue
